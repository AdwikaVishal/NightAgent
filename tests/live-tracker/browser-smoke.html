<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NightAgent live tracker browser smoke test</title>
  <style>body{font:14px system-ui;margin:20px;} pre{background:#f5f6fa;padding:12px;} .pass{color:#177245}.fail{color:#a31621}</style>
</head>
<body>
  <h1>Live tracker browser smoke test</h1>
  <p id="status">RUNNING</p>
  <pre id="log"></pre>
  <iframe id="app" title="tracker under test" style="width:1100px;height:900px;border:1px solid #ccd3e0"></iframe>

  <script>
    (async function () {
      const status = document.getElementById('status');
      const log = document.getElementById('log');
      const results = [];
      const check = (name, ok, detail) => {
        results.push({ name, ok, detail });
        log.textContent += `${ok ? 'PASS' : 'FAIL'} ${name}${detail ? ` — ${detail}` : ''}\n`;
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const waitFor = async (fn, timeoutMs = 5000) => {
        const started = Date.now();
        while (Date.now() - started < timeoutMs) {
          if (fn()) return true;
          await sleep(50);
        }
        return false;
      };

      try {
        const response = await fetch('/live-tracker/index.html');
        if (!response.ok) throw new Error(`tracker fetch ${response.status}`);
        let html = await response.text();
        html = html.replace(
          /https:\/\/unpkg\.com\/leaflet@1\.9\.4\/dist\/leaflet\.js/,
          '/tests/live-tracker/leaflet-stub.js'
        );
        html = html.replace('src="./contract.js"', 'src="/live-tracker/contract.js"');
        html = html.replace(
          /'https:\/\/www\.gstatic\.com\/firebasejs\/10\.12\.2\/firebase-[^']+\.js'/g,
          "'./firebase-mock.js'"
        );
        html = html.replace(
          '<script type="module">',
          `<script>
             window.fetch = (url) => url === '/__/firebase/init.json'
               ? Promise.resolve({ ok: true, status: 200, json: () => Promise.resolve({ projectId: 'smoke-test', apiKey: 'mock' }) })
               : Promise.reject(new Error('unexpected fetch ' + url));
           <\/script>
           <script type="module">`
        );

        const frame = document.getElementById('app');
        frame.srcdoc = html;
        await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));

        const win = frame.contentWindow;
        const doc = win.document;
        check('Firebase Hosting init config was consumed', await waitFor(() => win.__mockFirebaseReady && !!doc.getElementById('details')),
          'index.html completed module initialization');
        const mock = win.__mockFirebase;
        if (!mock) throw new Error('Firebase mock did not load');

        check('initial unauthorized state is explicit', /Sign in/i.test(doc.getElementById('message').textContent),
          doc.getElementById('message').textContent);

        doc.getElementById('targetUid').value = 'owner-uid';
        doc.getElementById('targetUid').dispatchEvent(new win.Event('change'));
        const authCallbackReady = await waitFor(() => mock.authListenerCount === 1);
        check('tracker registered an auth callback', authCallbackReady,
          `${mock.authListenerCount} auth callbacks`);
        check('target UID was set before sign-in', doc.getElementById('targetUid').value === 'owner-uid',
          doc.getElementById('targetUid').value);
        mock.setUser({ uid: 'uid-guardian', email: 'guardian@example.com' });
        const activeListenerReady = await waitFor(() => mock.listeners.length >= 1);
        check('sign-in starts an active-journey listener', activeListenerReady,
          `${mock.listeners.length} Firestore listeners`);
        mock.emitByPath('journeys', {
          empty: false,
          docs: [{ id: 'journey-1', data: () => ({}) }],
        });
        await sleep(100);

        const now = Date.now();
        mock.emitByPath('journeys/journey-1', {
          exists: () => true,
          data: () => ({
            status: 'ACTIVE',
            destinationName: 'Home',
            expectedArrivalTime: now + 600000,
            updatedAt: now,
            routePoints: [
              { latitude: 12.5, longitude: 77.1 },
              { latitude: 0, longitude: 0 },
              { latitude: 12.6, longitude: 77.2 },
              { latitude: 91, longitude: 0 },
            ],
            destinationLatitude: 12.7,
            destinationLongitude: 77.3,
          }),
        });
        mock.emitByPath('locations', {
          empty: false,
          docs: [{ data: () => ({ latitude: 12.55, longitude: 77.15, timestamp: now, accuracy: 8 }) }],
          metadata: { fromCache: false },
        });
        await sleep(100);
        check('valid latest location renders live status', /Live Firestore listener connected/.test(doc.getElementById('message').textContent),
          doc.getElementById('message').textContent);
        check('route rendering filters null island and out-of-range points',
          win.__leafletStub.polylines.some((coords) => coords.length === 2), JSON.stringify(win.__leafletStub.polylines));

        mock.emitByPath('locations', {
          empty: false,
          docs: [{ data: () => ({ latitude: 12.56, longitude: 77.16, timestamp: now - 200000, accuracy: 8 }) }],
          metadata: { fromCache: false },
        });
        await sleep(100);
        check('stale fix shows stale indicator', /stale/i.test(doc.getElementById('message').textContent),
          doc.getElementById('message').textContent);

        mock.emitByPath('locations', {
          empty: false,
          docs: [{ data: () => ({ latitude: 12.57, longitude: 77.17, timestamp: now, accuracy: 8 }) }],
          metadata: { fromCache: true },
        });
        await sleep(100);
        check('cached fresh fix shows offline indicator', /offline/i.test(doc.getElementById('message').textContent),
          doc.getElementById('message').textContent);

        const beforeInvalid = win.__leafletStub.markerUpdates.length;
        mock.emitByPath('locations', {
          empty: false,
          docs: [{ data: () => ({ latitude: 0, longitude: 0, timestamp: now }) }],
          metadata: { fromCache: false },
        });
        await sleep(100);
        check('null island fix is not rendered as a location', win.__leafletStub.markerUpdates.length === beforeInvalid,
          `${beforeInvalid} -> ${win.__leafletStub.markerUpdates.length}`);

        mock.emitByPath('locations', { empty: true, docs: [], metadata: { fromCache: false } });
        await sleep(100);
        check('empty location data is handled without crash', /no location/i.test(doc.getElementById('message').textContent),
          doc.getElementById('message').textContent);

        mock.setUser(null);
        await sleep(100);
        check('sign-out clears journey view state', /Sign in/i.test(doc.getElementById('message').textContent),
          doc.getElementById('message').textContent);

        const failed = results.filter((r) => !r.ok);
        status.textContent = failed.length === 0
          ? `PASS — ${results.length}/${results.length} browser smoke checks`
          : `FAIL — ${failed.length}/${results.length} checks failed`;
        status.className = failed.length === 0 ? 'pass' : 'fail';
      } catch (error) {
        status.textContent = `ERROR — ${error.message}`;
        status.className = 'fail';
        log.textContent += `ERROR ${error.stack || error}\n`;
      }
    })();
  </script>
</body>
</html>
